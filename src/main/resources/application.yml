# ============================================================
# Configuración común a todos los entornos.
# Lo que cambia entre entornos vive en application-dev.yml y
# application-prod.yml. Aquí NO debe haber ninguna credencial.
# ============================================================
spring:
    application:
        name: developteca-api

    # Perfil por defecto cuando no se indica ninguno (mvn spring-boot:run local).
    # Se sobreescribe con SPRING_PROFILES_ACTIVE o --spring.profiles.active=prod
    profiles:
        default: dev

    datasource:
        driver-class-name: org.postgresql.Driver

    jpa:
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    web:
        error:
            include-message: always
            include-binding-errors: always

    servlet:
        multipart:
            # Debe ser >= app.upload.max-file-size, o Spring rechaza el archivo
            # antes de que ImageService pueda validarlo.
            max-file-size: 5MB
            max-request-size: 10MB

jwt:
    expiration: ${JWT_EXPIRATION:86400000}  # 24 horas en milisegundos

server:
    port: ${PORT:8080}

app:
    upload:
        dir: ${UPLOAD_DIR:uploads}
        max-file-size: 5242880
        allowed-types: image/jpeg,image/png,image/webp

# Solo se expone /actuator/health, y sin detalles: basta para que Docker sepa si
# el contenedor está vivo, sin revelar estado interno ni versiones a quien lo consulte.
management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: never
